name: CI/CD Pipeline

on:
  push:
    branches:
      - jti # Change this to your branch name

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Add your Docker Hub username
          password: ${{ secrets.DOCKER_PASSWORD }} # Add your Docker Hub password

      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/my-app:latest # Change this to appropriate image name and tag

  deploy-terraform:
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Initialize Terraform
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Apply Terraform
        run: terraform apply -auto-approve
        env:
          CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
          SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

  deploy-app-service:
    runs-on: ubuntu-latest
    needs: deploy-terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }} # Add your Azure credentials

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: my-app-service
          slot-name: production
          images: ${{ secrets.DOCKER_USERNAME }}/my-app:latest # Change this to appropriate image name and tag

  run-tests:
    runs-on: ubuntu-latest
    needs: deploy-app-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Run tests
        run: |
          # Add your test commands here, example test command below
          curl -f https://my-app-service.azurewebsites.net || exit 1
